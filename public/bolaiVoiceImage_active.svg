<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient for circle ring -->
    <linearGradient id="ringGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7ef9ff"/>
      <stop offset="50%" stop-color="#b58cff"/>
      <stop offset="100%" stop-color="#ff7ecb"/>
    </linearGradient>

    <style>
      <![CDATA[
        /* Rotating swirls */
        .swirl-group {
          transform-origin: 256px 256px;
          animation: spin 14s linear infinite;
        }
        @keyframes spin {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }

        /* Pulsing glowing ring */
        .pulse {
          animation: pulse 2.4s ease-in-out infinite;
          transform-origin: 256px 256px;
        }
        @keyframes pulse {
          0%   { transform: scale(1); opacity: 1; }
          50%  { transform: scale(1.04); opacity: 0.85; }
          100% { transform: scale(1); opacity: 1; }
        }

        /* Orbiting dot */
        .orbit {
          transform-origin: 256px 256px;
          animation: orbit 6s linear infinite;
        }
        @keyframes orbit {
          from { transform: rotate(0deg) translateX(210px); }
          to   { transform: rotate(360deg) translateX(210px); }
        }
      ]]>
    </style>
  </defs>

  <!-- Removed white background for transparency -->

  <!-- Rotating swirls (crisp edges) -->
  <g class="swirl-group">
    <path d="M256 100 C340 140, 400 200, 370 270 C340 340, 260 380, 190 340 C120 300, 130 200, 200 150 Z"
          fill="rgba(255,120,140,0.55)"/>
    <path d="M180 160 C240 120, 340 140, 360 220 C380 300, 310 360, 230 350 C150 340, 120 260, 150 200 Z"
          fill="rgba(120,200,255,0.55)"/>
    <path d="M300 200 C360 180, 400 240, 390 300 C380 360, 320 400, 260 390 C200 380, 190 320, 220 270 Z"
          fill="rgba(160,255,140,0.5)"/>
  </g>

  <!-- Glowing circle ring -->
  <circle class="pulse" cx="256" cy="256" r="210"
          stroke="url(#ringGrad)" stroke-width="12"
          fill="none" filter="url(#glow)"/>

  <!-- Orbiting active dot -->
  <g class="orbit">
    <circle cx="256" cy="256" r="12" fill="#6fff9a" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
